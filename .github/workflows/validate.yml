name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill packages
        run: python3 scripts/validate.py
      - name: Smoke-test installation
        run: python3 scripts/install.py --all --target "$RUNNER_TEMP/skills"
